# Kinetic OS server. Quick start:  cp .env.example .env  (set JWT_SECRET)  &&  docker compose up -d
# HTTPS with automatic certificates:  docker compose --profile https up -d
name: kinetic-os

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: kinetic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-too}
      POSTGRES_DB: kinetic
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetic -d kinetic"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    image: kinetic-os-server:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required (generate with openssl rand -hex 32)}"
      DATABASE_URL: postgres://kinetic:${POSTGRES_PASSWORD:-change-me-too}@db:5432/kinetic
      TRUST_PROXY: ${TRUST_PROXY:-0}
      DATA_DIR: /data
      # Only used when the optional routing profile is running (see README "Road routing")
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
    volumes:
      - api_data:/data
    ports:
      - "${API_PORT:-8080}:8080"

  # Optional self-hosted road routing (OSRM). Enable with: --profile routing
  # Prepare the map data first:  ./osrm/prepare.sh europe/liechtenstein
  # Not published on the host; the API reverse-proxies it at GET /api/v1/route.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    profiles: ["routing"]
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "--max-viaroute-size", "25", "/data/region.osrm"]
    volumes:
      - ./osrm-data:/data:ro
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: kinetic
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-too}
      PGDATABASE: kinetic
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
      - ./backup/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

  # Optional HTTPS reverse proxy (automatic Let's Encrypt). Enable with: --profile https
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  api_data:
  caddy_data:
  caddy_config:
